[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simrace-agent"
version = "0.1.0"
description = "Agent Windows: lit la telemetrie d'Assetto Corsa Competizione et l'envoie au serveur simrace"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
simrace-agent = "simrace_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simrace_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
