[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simrace-server"
version = "0.1.0"
description = "Serveur simrace: reception des lots de telemetrie, validation, diffusion SSE"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
